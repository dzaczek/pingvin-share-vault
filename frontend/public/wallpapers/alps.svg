      <stop offset="0" stop-color="#7fb2f0"/>
      <stop offset="0.38" stop-color="#bcd6f7"/>
      <stop offset="0.56" stop-color="#f6e3cf"/>
      <stop offset="1" stop-color="#f6e3cf"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.78" cy="0.22" r="0.32">
      <stop offset="0" stop-color="#fff8e7" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff8e7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9bcdc"/>
      <stop offset="1" stop-color="#cdd8ea"/>
